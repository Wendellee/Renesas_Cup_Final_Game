name: Deploy report website to GitHub Pages

on:
  push:
    branches:
      - report
    paths:
      - "report/web/**"
      - ".github/workflows/deploy-report-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload report website
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
